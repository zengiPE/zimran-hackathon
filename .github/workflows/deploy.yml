# Deploys web/ and api/ to Vercel on every push and PR.
# Vercel's own Git integration is turned off (git.deploymentEnabled=false in each vercel.json):
# on the free Hobby plan it blocks commits from teammates in a private repo. Here every deploy
# is made with the owner's VERCEL_TOKEN, so it doesn't matter who authored the commit.
name: Deploy

# Every branch push deploys: main → production, other branches → preview (URL is commented on the PR)
on:
  push:
    branches: ["**"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: team_5qeB5w6VjX8QoqWggpDRgiSj

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            project_id: prj_kC7NVszitTMequLthA9WjAnO6Xvo
          - name: api
            project_id: prj_nj6rt9p5NSPzfK3wKzInsoSd9qKK
    env:
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      IS_PROD: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN is not set (repo Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g vercel@latest

      # Deploy from the repo root: the Vercel project's Root Directory (web/ or api/) is applied server-side
      - name: Deploy ${{ matrix.name }}
        id: deploy
        run: |
          if [ "$IS_PROD" = "true" ]; then
            url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          else
            url=$(vercel deploy --yes --token "$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.name }}: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: env.IS_PROD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --json number -q '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Preview **${{ matrix.name }}** (${GITHUB_SHA::7}): ${{ steps.deploy.outputs.url }}"
          fi
