[project]
name = "api"
version = "0.1.0"
description = "Zimran hackathon — backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi[standard]>=0.162.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
