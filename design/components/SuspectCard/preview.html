<!-- @dsCard group="People" height=360 subtitle="Five pinned polaroids: open, cleared, guilty" -->

      <figcaption><p class="cf-suspect__name">Sam</p><p class="cf-suspect__role">The newcomer, someone's plus-one</p></figcaption>
